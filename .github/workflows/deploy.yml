name: Deploy to GitHub Pages

# Deploys the static site whenever main is updated — including after the
# weekly data job. That job pushes with the built-in GITHUB_TOKEN, and GitHub
# never lets such a push start another workflow, so a plain `on: push` never saw
# the data commits (they only went live on the next human push). workflow_run
# fires when the data job finishes and deploys the latest main.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Fetch live data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # After the data job, deploy only if it succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      # Rewrite every asset/data cache-busting token (?v=…) to this commit's SHA
      # so each deploy serves fresh CSS/JS/JSON and no client is left on a stale
      # copy. This edits only the CI checkout (the artifact), never the repo — the
      # source keeps its placeholder token for local dev.
      - name: Cache-bust assets
        run: |
          V="${GITHUB_SHA::8}"
          for f in index.html js/*.js; do
            [ -f "$f" ] && sed -i "s/?v=[A-Za-z0-9._-]*/?v=$V/g" "$f"
          done
          echo "Cache-busted assets with token $V"

      # Publish an explicit allowlist of runtime files, never the whole repo, so
      # internal docs, scripts, tooling config and audit notes stay unpublished.
      # A new top-level runtime file must be added here to go live.
      - name: Assemble site (allowlist)
        run: |
          mkdir _site
          cp index.html 404.html robots.txt .nojekyll _site/
          mkdir -p _site/.well-known && cp .well-known/security.txt _site/.well-known/
          cp -r css js fonts _site/
          rsync -a --exclude='*.md' --exclude='brochures/' data/ _site/data/
          # A CNAME file (custom domain) is carried over if the repo has one.
          [ -f CNAME ] && cp CNAME _site/
          # Guard: only runtime file types may be published.
          bad=$(find _site -type f ! -name '.nojekyll' ! -name 'CNAME' \
                ! -regex '.*\.\(html\|css\|js\|json\|woff2\|txt\)$')
          if [ -n "$bad" ]; then
            echo "Non-runtime files in deploy artifact:"; echo "$bad"; exit 1
          fi
          echo "Publishing $(find _site -type f | wc -l) files"

      # Note: upload-pages-artifact v4+ drops hidden files by default. If
      # Dependabot proposes v4, set include-hidden-files: true, or .nojekyll and
      # .well-known/security.txt will silently stop being published.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
