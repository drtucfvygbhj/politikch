name: Deploy to GitHub Pages

# Deploys the static site whenever main is updated — including after the
# weekly data job. That job pushes with the built-in GITHUB_TOKEN, and GitHub
# never lets such a push start another workflow, so a plain `on: push` never saw
# the data commits (they only went live on the next human push). workflow_run
# fires when the data job finishes and deploys the latest main.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Fetch live data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Nothing is deployed unless the guardrail checks (GUARDRAILS.md,
  # scripts/check.py) pass on the exact commit being deployed. For a push, every
  # flagged change since the previous main must carry the owner's sign-off
  # ("Approved-Rule: …" in a commit message); the data job's own refresh was
  # already checked before it was committed.
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Guardrail checks
        env:
          BEFORE: ${{ github.event.before }}
        run: python3 scripts/check.py ${BEFORE:+--base "$BEFORE"} --strict

  deploy:
    needs: check
    # After the data job, deploy only if it succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}   # the same commit the check job passed

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Rewrite every asset/data cache-busting token (?v=…) to this commit's SHA
      # so each deploy serves fresh CSS/JS/JSON and no client is left on a stale
      # copy. This edits only the CI checkout (the artifact), never the repo — the
      # source keeps its placeholder token for local dev.
      - name: Cache-bust assets
        run: |
          V="${GITHUB_SHA::8}"
          for f in index.html js/*.js; do
            [ -f "$f" ] && sed -i "s/?v=[A-Za-z0-9._-]*/?v=$V/g" "$f"
          done
          echo "Cache-busted assets with token $V"

      # Publish an explicit allowlist of runtime files, never the whole repo, so
      # internal docs, scripts, tooling config and audit notes stay unpublished.
      # A new top-level runtime file must be added here to go live.
      - name: Assemble site (allowlist)
        run: |
          mkdir _site
          if [ -f MAINTENANCE_MODE ]; then
            # Kill switch: a file named MAINTENANCE_MODE at the repo root takes the
            # site off and publishes only the notice page, which keeps the contact
            # and data-protection addresses reachable. Delete the file to go back
            # live. See MAINTENANCE.md. The flag lives in the repo, so the weekly
            # data job's deploy cannot silently bring the site back.
            cp maintenance.html _site/index.html
            cp maintenance.html _site/404.html
            printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
            touch _site/.nojekyll
            echo "::warning::MAINTENANCE MODE — publishing the notice page only, not the site"
          else
            cp index.html 404.html robots.txt .nojekyll _site/
            cp -r css js fonts _site/
            rsync -a --exclude='*.md' --exclude='brochures/' data/ _site/data/
            # The owner's own photos (WebP only), published with the admin's
            # "Publish images" button. check.py blocks any image without a
            # licence record in images/LICENSES.json (LIC-01); the record itself
            # stays in the repo and is not published.
            if [ -d images ]; then
              mkdir -p _site/images
              find images -maxdepth 1 -type f -name '*.webp' -exec cp {} _site/images/ \;
            fi
          fi
          mkdir -p _site/.well-known && cp .well-known/security.txt _site/.well-known/
          # A CNAME file (custom domain) is carried over if the repo has one.
          [ -f CNAME ] && cp CNAME _site/
          # Guard: only runtime file types may be published.
          bad=$(find _site -type f ! -name '.nojekyll' ! -name 'CNAME' \
                ! -regex '.*\.\(html\|css\|js\|json\|woff2\|txt\|webp\)$')
          if [ -n "$bad" ]; then
            echo "Non-runtime files in deploy artifact:"; echo "$bad"; exit 1
          fi
          echo "Publishing $(find _site -type f | wc -l) files"

      # upload-pages-artifact v4+ drops hidden files unless told otherwise;
      # without this, .well-known/security.txt would silently stop being published.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '_site'
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
