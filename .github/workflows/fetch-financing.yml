name: Fetch financing data

# Refreshes data/financing.json from the official EFK party/campaign
# financing register on a schedule, so the site stays current without
# anyone needing to push a manual update. Committing the regenerated file
# is what "publishes" it — the existing deploy workflow then picks up that
# commit like any other push to main. This keeps the deployed site fully
# static; only this CI job talks to the EFK's servers.
on:
  schedule:
    - cron: '0 4 * * 1' # weekly, Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch financing data
        run: python3 scripts/fetch_financing.py

      - name: Validate data files
        run: python3 scripts/validate.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/financing.json; then
            echo "No changes to data/financing.json"
            exit 0
          fi
          git config user.name "politikch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/financing.json
          git commit -m "Update party/campaign financing data from EFK register"
          git push
