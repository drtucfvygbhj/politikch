name: Fetch live data

# Refreshes the site's live data from official Swiss open-data sources on a
# schedule, so the site stays current without anyone pushing a manual update:
#   * data/initiatives.json — latest federal votes (VoteInfo / opendata.swiss)
#     plus pending & signature-gathering popular initiatives (Federal Chancellery
#     LINDAS cube).
#   * data/overviews/initiative/<id>.json — the official for/against arguments
#     for each vote, reproduced verbatim from the Federal Council's voting
#     brochure ("Erläuterungen", Art. 5 URG). DE/FR are automatic; a vote whose
#     brochure isn't published yet is simply skipped (no fabrication).
#   * data/financing.json — party & campaign financing (EFK register).
#   * data/canton-data.json — per-canton National Council results and
#     municipality/district counts (Federal Statistical Office / opendata.swiss).
#   * data/sessions-index.json + data/sessions/<id>.json — recent Federal
#     Assembly sessions, their final votes and per-party tallies (parlament.ch
#     OData web service). Settled sessions are cached per file; only recent ones
#     are re-fetched, so this stays cheap as history grows.
#   * data/mt.json — English MACHINE translations (DeepL, a dedicated translation
#     engine, not an LLM) of the texts with no official English: session vote
#     titles, for/against arguments and session summaries. Labelled "machine
#     translation" on the site and linked to the official source. Needs the
#     DEEPL_API_KEY secret; without it this no-ops and English keeps its
#     official-language fallback.
# Romansh (rm) has NO machine translation (DeepL doesn't support it), so RM titles
# still fall back to the official DE/FR/IT unless hand-translated:
# check_translations.py records missing RM ones in TRANSLATIONS_TODO.md and this
# job opens/refreshes a GitHub issue as a reminder.
# Initiatives are fetched first because the financing fetcher matches campaign
# filings against the decided votes in data/initiatives.json. Committing the
# regenerated files is what "publishes" them — deploy.yml runs when this job
# completes (workflow_run) and deploys the new commit. The deployed site stays
# fully static; only this CI job talks to the official servers.
on:
  schedule:
    - cron: '0 4 * * 1' # weekly, Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      # Don't leave the write token in .git/config: the steps below run
      # third-party code (PyPI packages, a PDF parser fed from the internet).
      # Only the commit step gets the token, explicitly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          pip install -r scripts/requirements-arguments.txt

      - name: Fetch initiatives & referendums
        run: python3 scripts/fetch_initiatives.py

      - name: Fetch official vote arguments (for / against)
        # Verbatim pro/con from the Federal Council brochure (Art. 5 URG), DE/FR
        # from the officially-published PDF; skips any vote whose brochure isn't
        # out yet (stays an honest placeholder). Never fabricates. Add native IT
        # by dropping an official PDF in data/brochures/ (see its README).
        run: python3 scripts/fetch_arguments.py

      - name: Fetch financing data
        run: python3 scripts/fetch_financing.py

      - name: Fetch per-canton data (elections & municipalities)
        run: python3 scripts/fetch_cantons.py

      - name: Fetch Federal Assembly sessions & final votes
        run: python3 scripts/fetch_sessions.py

      # Machine-translate the English gaps (session titles, for/against arguments,
      # session summaries) via DeepL — a dedicated translation engine, not an LLM.
      # Output is labelled "machine translation" on the site and linked to the
      # official source. No-ops without the secret, so the site keeps its
      # official-language fallback. RM has no machine translation (DeepL lacks it).
      - name: Machine-translate English gaps (DeepL)
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python3 scripts/translate.py

      - name: Check for titles needing a hand translation
        run: python3 scripts/check_translations.py

      - name: Validate data files
        run: python3 scripts/validate.py

      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/initiatives.json data/financing.json data/canton-data.json data/sessions-index.json data/sessions data/overviews data/mt.json TRANSLATIONS_TODO.md; then
            echo "No changes to live data files"
            exit 0
          fi
          git config user.name "politikch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/initiatives.json data/financing.json data/canton-data.json data/sessions-index.json data/sessions data/overviews data/mt.json TRANSLATIONS_TODO.md
          git commit -m "Update live data (votes, initiatives, financing, cantons, sessions, vote arguments)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      # Reminder to translate new titles by hand — opens or refreshes one GitHub
      # issue (uses the built-in GITHUB_TOKEN, no external/AI key). Best-effort.
      - name: Open/refresh translation reminder issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q "need translation" TRANSLATIONS_TODO.md 2>/dev/null; then
            title="Translations needed for new titles"
            num=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty' 2>/dev/null || true)
            if [ -n "$num" ]; then
              gh issue edit "$num" --body-file TRANSLATIONS_TODO.md || true
            else
              gh issue create --title "$title" --body-file TRANSLATIONS_TODO.md || true
            fi
          else
            echo "No pending translations; no reminder issue needed."
          fi
