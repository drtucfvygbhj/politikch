name: Validate

# Sanity-checks the data on every push and pull request so a broken
# JSON file or a seat-count typo can't reach the live site.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate data files
        run: python3 scripts/validate.py
