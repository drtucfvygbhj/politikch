name: Checks

# Runs the guardrail checks (GUARDRAILS.md, scripts/check.py) on every pull
# request and on pushes to other branches, so problems show up before anything
# reaches main. Pushes to main are checked again by deploy.yml, which refuses to
# deploy unless the checks pass.
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0              # the checks compare against the base commit
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Guardrail checks
        env:
          # A PR is compared with its base; a branch push with its previous state.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check.py --base "$BASE" --strict
